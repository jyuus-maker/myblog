<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE JOURNAL — Register</title>
    <link rel="stylesheet" th:href="@{/css/signup.css}">
</head>
<body>

<div class="auth-viewport">
    <div class="auth-card">
        <!-- Auth Header -->
        <header class="auth-header">
            <div>
                <span class="auth-brand-badge">ENROLLMENT</span>
                <h1 class="auth-title">Register</h1>
            </div>
            <div class="auth-meta-edition">CONTRIBUTOR</div>
        </header>

        <!-- Form -->
        <form th:action="@{/user}" method="post" class="auth-form">
            <input type="hidden" th:name="${_csrf?.parameterName}" th:value="${_csrf?.token}" />

            <div class="form-group">
                <label class="field-label">Email Address</label>
                <input type="email" class="field-input" name="email" placeholder="author@journal.com" required autocomplete="username">
            </div>

            <div class="form-group">
                <label class="field-label">Password</label>
                <input type="password" class="field-input" name="password" placeholder="••••••••" required autocomplete="new-password">
            </div>

            <button type="submit" class="btn-editorial-submit">CREATE ACCOUNT →</button>
        </form>

        <div class="auth-links">
            <span>Already registered?</span>
            <a th:href="@{/login}">Sign In to Existing Desk →</a>
        </div>
    </div>
</div>

<!-- Auth Footer -->
<footer class="auth-footer">
    <span>© 2026 THE JOURNAL</span>
    <a th:href="@{/articles}" style="color: inherit; text-decoration: none;">← RETURN TO ARCHIVE</a>
</footer>

</body>
</html>
