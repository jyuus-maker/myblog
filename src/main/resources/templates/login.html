<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE JOURNAL — Sign In</title>
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body>

<div class="auth-viewport">
    <div class="auth-card">
        <!-- Auth Header -->
        <header class="auth-header">
            <div>
                <span class="auth-brand-badge">AUTHENTICATION</span>
                <h1 class="auth-title">Sign In</h1>
            </div>
            <div class="auth-meta-edition">VOL. 01</div>
        </header>

        <!-- Login Error Alert -->
        <div th:if="${param.error}" class="auth-alert-error">
            INVALID CREDENTIALS. PLEASE VERIFY AND RETRY.
        </div>

        <!-- Form -->
        <form th:action="@{/login}" method="post" class="auth-form">
            <input type="hidden" th:name="${_csrf?.parameterName}" th:value="${_csrf?.token}" />

            <div class="form-group">
                <label class="field-label">Email Address</label>
                <input type="email" class="field-input" name="email" placeholder="editor@journal.com" required autocomplete="username">
            </div>

            <div class="form-group">
                <label class="field-label">Password</label>
                <input type="password" class="field-input" name="password" placeholder="••••••••" required autocomplete="current-password">
            </div>

            <button type="submit" class="btn-editorial-submit">AUTHENTICATE →</button>
        </form>

        <div class="auth-divider">
            <span>OR CONTINUE WITH</span>
        </div>

        <a th:href="@{/oauth2/authorization/google}" class="btn-oauth-google">
            <svg viewBox="0 0 24 24">
                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
            </svg>
            GOOGLE PASSPORT
        </a>

        <div class="auth-links">
            <span>Need an account?</span>
            <a th:href="@{/signup}">Register as Contributor →</a>
        </div>
    </div>
</div>

<!-- Auth Footer -->
<footer class="auth-footer">
    <span>© 2026 THE JOURNAL</span>
    <a th:href="@{/articles}" style="color: inherit; text-decoration: none;">← RETURN TO ARCHIVE</a>
</footer>

</body>
</html>
