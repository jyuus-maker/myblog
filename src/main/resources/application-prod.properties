# =========================================================================
# [PROD] 운영 배포 환경 전용 설정 (클라우드/Docker/상용 서버)
# =========================================================================
server.port=${PORT:8080}

# 보안: Jasypt 키는 배포 시 환경변수(JASYPT_ENCRYPTOR_PASSWORD)로 주입
jasypt.encryptor.password=${JASYPT_ENCRYPTOR_PASSWORD}

# PostgreSQL 운영 DB 설정 (환경변수 주입)
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# HikariCP 커넥션 풀 최적화
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=MyBlogHikariProdPool

# JPA/Hibernate 운영 최적화 및 스키마 보호
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.show_sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=false

# 로깅 레벨 최적화
logging.level.root=INFO
logging.level.com.example.myblog=INFO
logging.level.org.hibernate=WARN

# 템플릿 캐싱 활성화 (서버 렌더링 성능 극대화)
spring.thymeleaf.cache=true

# 운영 파일 업로드 경로
file.upload-dir=${FILE_UPLOAD_DIR:./uploads}

# 보안: JWT 시크릿 및 OAuth2 키는 환경변수로 필수 주입
jwt.secret-key=${JWT_SECRET_KEY}

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile

# 운영 초기 관리자 계정 (환경변수 주입 가능)
app.admin.email=${ADMIN_EMAIL:admin@myblog.com}
app.admin.password=${ADMIN_PASSWORD:admin1234}
