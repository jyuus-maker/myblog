# =========================================================================
# THE JOURNAL — 공통 애플리케이션 설정 (Base Configuration)
# =========================================================================
spring.application.name=myblog

# 기본 활성 프로파일: dev (로컬 개발 환경)
# 운영 환경 실행 시: --spring.profiles.active=prod 또는 SPRING_PROFILES_ACTIVE=prod 환경변수 지정
spring.profiles.active=dev

# =========================================================================
# 문자 인코딩 설정 (한글 파일명 및 본문 깨짐 방지)
# =========================================================================
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
server.servlet.encoding.enabled=true

# =========================================================================
# 파일 업로드(멀티파트) 공통 설정
# =========================================================================
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=100MB

# =========================================================================
# JPA 배치 페치 사이즈 최적화 (N+1 문제 완화)
# =========================================================================
spring.jpa.properties.hibernate.default_batch_fetch_size=1000

# =========================================================================
# Jasypt 기본 암호화 빈 설정
# =========================================================================
jasypt.encryptor.bean=jasyptStringEncryptor

# =========================================================================
# JWT Issuer 공통 설정
# =========================================================================
jwt.issuer=myblog
