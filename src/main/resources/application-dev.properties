# =========================================================================
# [DEV] 로컬 개발 환경 전용 설정
# =========================================================================
server.port=8090

# Jasypt 복호화 키 (로컬 기본값 제공)
jasypt.encryptor.password=${JASYPT_ENCRYPTOR_PASSWORD:myblog-secret-key-1234}

# PostgreSQL 로컬 데이터베이스
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/blogdb}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=ENC(wqaY/ofx5yi9bC2IG46bQJJ3spjjoNRe)

# JPA & SQL 로깅
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.show_sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.orm.jdbc.bind=trace

# LiveReload & 초기화 방지
spring.devtools.livereload.enabled=true
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=never

# 템플릿 캐싱 비활성화 (실시간 수정 반영)
spring.thymeleaf.cache=false

# 로컬 파일 업로드 상대 경로 (플랫폼 독립적)
file.upload-dir=./uploads

# 로컬 JWT 시크릿 키
jwt.secret-key=study-springboot-jwt-secret-key-study-springboot-jwt-secret-key

# OAuth2 로컬 설정
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:dummy-google-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:dummy-google-client-secret}
spring.security.oauth2.client.registration.google.scope=email,profile

# 로컬 초기 계정
app.admin.email=admin@myblog.com
app.admin.password=admin1234
