# 테스트 환경 전용 설정 파일 (application.properties)
spring.application.name=myblog-test

# 데이터베이스 설정 (H2 In-Memory)
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate 설정
spring.jpa.properties.hibernate.show_sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=create-drop

# SQL 초기화 설정
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=never

# =========================================================================
# JWT 테스트 설정
# =========================================================================
jwt.issuer=myblog-test
jwt.secret-key=study-springboot-jwt-secret-key-study-springboot-jwt-secret-key

# =========================================================================
# OAuth2 구글 테스트 더미 설정
# =========================================================================
spring.security.oauth2.client.registration.google.client-id=dummy-test-client-id
spring.security.oauth2.client.registration.google.client-secret=dummy-test-client-secret
spring.security.oauth2.client.registration.google.scope=email,profile
